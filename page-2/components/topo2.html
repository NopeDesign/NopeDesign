<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOPE | Agência Digital</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- CSS Embutido para forçar o navegador a ler as regras atualizadas -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #000000; color: #ffffff; overflow-x: hidden; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 60px; background-color: #000000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
        
        /* === LOGO AUMENTADA DRASTICAMENTE PARA DESKTOP === */
        .logo-img { height: 50px; width: auto; display: block; max-height: none; }

        /* MENU DESKTOP */
        .nav-menu { display: flex; align-items: center; flex: 1; }
        .nav-menu nav { margin: 0 auto; }
        .nav-links { list-style: none; display: flex; gap: 40px; align-items: center; }
        .nav-links li a { text-decoration: none; color: #b3b3b3; font-size: 15px; font-weight: 500; transition: color 0.3s; }
        .nav-links li a:hover { color: #ffffff; }

        .btn-whatsapp {
            background: linear-gradient(90deg, #00A3FF 0%, #002D85 100%); 
            color: #ffffff;
            padding: 14px 34px; 
            border-radius: 100px; 
            text-decoration: none; 
            font-size: 15px;
            font-weight: 600; 
            display: inline-flex; 
            align-items: center; 
            white-space: nowrap; 
            flex-shrink: 0;
        }

        .menu-toggle { display: none; }

        /* RESPONSIVO MOBILE */
        @media (max-width: 768px) {
            .navbar { padding: 15px 24px; }
            
            /* === LOGO AJUSTADA PARA O CELULAR === */
            .logo-img { height: 80px; }
            
            /* Esconde o menu original */
            .nav-menu { display: none !important; }

            /* Mostra o botão Hambúrguer */
            .menu-toggle {
                display: flex; flex-direction: column; gap: 5px; cursor: pointer; padding: 5px; z-index: 1001;
            }
            .menu-toggle span { width: 28px; height: 2px; background-color: #ffffff; transition: 0.3s; }

            /* A MÁGICA DO MENU MOBILE */
            .navbar.menu-aberto .nav-menu {
                display: flex !important;
                flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%;
                background-color: #000000; padding: 30px 24px 40px; border-top: 1px solid rgba(255, 255, 255, 0.1);
                gap: 30px; align-items: center; box-shadow: 0 15px 25px rgba(0,0,0,0.8);
            }
            .navbar.menu-aberto .nav-menu nav { margin: 0; width: 100%; }
            .navbar.menu-aberto .nav-links { flex-direction: column; gap: 25px; width: 100%; }
            .navbar.menu-aberto .btn-whatsapp { width: 100%; max-width: 300px; justify-content: center; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <!-- Caminho ajustado com ./ para a logo linkada -->
        <a href="./page-1/page-1.html" class="logo">
            <!-- Caminho ajustado com ./ para a imagem da logo -->
            <img src="./src/logo.png" alt="Logo NOPE" class="logo-img">
        </a>

        <div class="nav-menu">
            <nav>
                <ul class="nav-links">
                    <!-- Caminhos ajustados com ./ para todas as páginas -->
                    <li><a href="./page-1/page-1.html">Início</a></li>
                    <li><a href="./page-2/page-2.html">Quem Somos</a></li>
                    <li><a href="./page-3/page-3.html">Serviços</a></li>
                    <li><a href="./page-4/page-4.html">Portfólio</a></li>
                </ul>
            </nav>

            <a href="https://wa.me/5511972527752?text=Ol%C3%A1%2C%20gostaria%20de%20tirar%20algumas%20d%C3%BAvidas" 
                class="btn-whatsapp" 
                target="_blank" 
                rel="noopener noreferrer">
                Falar no WhatsApp
            </a>
        </div>

        <div class="menu-toggle" aria-label="Abrir menu" role="button" onclick="this.closest('.navbar').classList.toggle('menu-aberto')">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

</body>
</html>
