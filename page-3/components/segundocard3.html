<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Serviços complementares da NOPE Design: captação de leads, captação de imagem in loco e criação de logotipos profissionais.">
    <title>Serviços Adicionais | Nope Design</title>
    
    <!-- Fontes (com Preconnect para carregamento mais rápido) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/segundocard3.css">
</head>
<body>

    <!-- Seção de Serviços (Linha Inferior) -->
    <section class="services-section" aria-label="Serviços adicionais">
        <div class="cards-container">
            
            <!-- Card 1: Captação de Leads -->
            <a href="https://wa.me/5511972527752?text=Oi!%20Gostaria%20de%20solicitar%20um%20orçamento%20para%20Captação%20de%20Leads%20Mensal." class="service-card" aria-label="Solicitar orçamento para Captação de Leads Mensal no WhatsApp">
                <div class="icon-box">
                    <img src="/page-3/src/Captação-de-leads-mensal.png" alt="Ícone representando o serviço de captação de leads e gestão de tráfego">
                </div>

                <h3>Captação de leads mensal</h3>
                
                <!-- OBS: As tags <ul> vazias foram removidas por questões de acessibilidade e SEO. Adicione-as de volta aqui com as tags <li> caso vá inserir texto. -->
                
                <div class="price-container">
                    <div class="unit-price">
                        <span>+ Investimento no Meta</span>
                    </div>
                    <div class="price-tag">R$ 400</div>
                </div>
            </a>

            <!-- Card 2: Captação de Imagem -->
            <a href="https://wa.me/5511972527752?text=Oi!%20Gostaria%20de%20solicitar%20um%20orçamento%20para%20Captação%20de%20Imagem." class="service-card" aria-label="Solicitar orçamento para Captação de Imagem no WhatsApp">
                <div class="icon-box">
                    <img src="/page-3/src/Captação-de-Imagem.png" alt="Ícone representando o serviço de captação de imagens e filmagem profissional in loco">
                </div>

                <h3>Captação de Imagem</h3>
                
                <div class="price-container">
                    <div class="unit-price">
                        <span>4 Horas de Captação • Edição e Slides inclusos • Passagem a combinar</span>
                    </div>
                    <div class="price-tag">R$ 500</div>
                </div>
            </a>

            <!-- Card 3: Criação de Logo -->
            <a href="https://wa.me/5511972527752?text=Oi!%20Gostaria%20de%20solicitar%20um%20orçamento%20para%20Criação%20de%20Logo." class="service-card" aria-label="Solicitar orçamento para Criação de Logo no WhatsApp">
                <div class="icon-box">
                    <img src="/page-3/src/bt-logo.png" alt="Ícone representando o serviço de design e criação de identidade visual">
                </div>

                <h3>Criação de Logo</h3>
                
                <div class="price-container">
                    <div class="price-tag">1 Unidade: R$ 200</div>
                </div>
            </a>

        </div>
    </section>

</body>
</html>
