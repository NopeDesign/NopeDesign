<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Confira o nosso portfólio. Apresentamos nossos melhores trabalhos, projetos criativos e resultados gerados pela NOPE Design.">
    <meta name="author" content="NOPE Design">
    
    <title>Nosso Portfólio | NOPE Design</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Excelente! O caminho relativo já está correto -->
    <link rel="stylesheet" href="./css/carrosel4.css">
</head>

<body>

    <!-- Container para o Menu (Topo) -->
    <div id="topo4"></div>

    <main>
        <section class="portfolio" aria-labelledby="portfolio-title">
            <h2 id="portfolio-title">Nosso Portfólio</h2>
            
            <div class="portfolio-grid" id="portfolio-grid" aria-live="polite">
                <!-- O conteúdo gerado via JS (scripts.js) entrará aqui -->
            </div>

            <nav class="pagination" id="pagination" aria-label="Navegação do portfólio">
                <button id="prev" class="btn-paginate" aria-label="Página anterior">&laquo;</button>
                <div id="page-numbers" class="page-numbers-container" aria-live="polite"></div>
                <button id="next" class="btn-paginate" aria-label="Próxima página">&raquo;</button>
            </nav>
        </section>
    </main>

    <!-- ADICIONADO: Faltava a div para o script conseguir injetar o rodapé! -->
    <div id="footer"></div>

    <!-- Excelente! Os caminhos relativos dos scripts também estão corretos -->
    <script src="./js/include4.js"></script>
    <script src="./js/scripts.js"></script>
</body>
</html>
