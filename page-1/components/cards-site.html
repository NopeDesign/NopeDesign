<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO: Meta description é essencial para indexação e exibição no Google -->
    <meta name="description" content="A NOPE dá vida às suas ideias com serviços de Identidade Visual, Gestão de Redes Sociais e Marketing Estratégico.">
    
    <!-- SEO: Títulos mais atrativos e descritivos funcionam melhor -->
    <title>NOPE | Damos vida às suas ideias</title>
    
    <!-- Performance: Preconnect acelera o carregamento de fontes externas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Boas práticas: Uso do ./ para indicar que a pasta css está no mesmo diretório -->
    <link rel="stylesheet" href="./css/cards-1.css">
</head>
<body>

    <!-- Semântica: Envolver o conteúdo principal na tag <main> -->
    <main>
        
        <!-- Acessibilidade: Associando o título principal à seção para leitores de tela -->
        <section class="services-section" aria-labelledby="services-title">
            <h2 id="services-title" class="main-title">Damos vida às suas ideias.</h2>
            
            <!-- Acessibilidade: Ocultando elementos puramente visuais de leitores de tela -->
            <div class="glow-line" aria-hidden="true"></div>

            <div class="cards-container">
                
                <!-- Semântica: Um card de serviço funciona bem como um <article> -->
                <article class="service-card">
                    <!-- Caminho Relativo para a página 3 -->
                    <a href="../page-3/page-3.html" class="card-link">
                        <div class="icon-box">
                            <!-- Caminho Relativo para a imagem -->
                            <img src="../page-1/src/bt-identidade-visual.png" alt="Ícone de Identidade Visual" loading="lazy" style="margin-left: 50px;">
                        </div>
                        <h3>Identidade Visual</h3>
                        <p>Criação de logos e marcas memoráveis</p>
                    </a>
                </article>

                <article class="service-card">
                    <a href="../page-3/page-3.html" class="card-link">
                        <div class="icon-box">
                            <!-- ⚠️ DICA: Renomeie o arquivo no seu PC para "bt-gestao-de-redes-sociais.png" (sem acento) -->
                            <img src="../page-1/src/bt-Gestão-de-Redes-Sociais.png" alt="Ícone de Gestão de Redes Sociais" loading="lazy">
                        </div>
                        <h3>Gestão de Redes Sociais</h3>
                        <p>Conteúdo estratégico para engajar seu público</p>
                    </a>
                </article>

                <article class="service-card">
                    <a href="../page-3/page-3.html" class="card-link">
                        <div class="icon-box">
                            <!-- ⚠️ DICA: Renomeie o arquivo no seu PC para "bt-marketing-estrategico.png" (sem acento) -->
                            <img src="../page-1/src/bt-Marketing-Estratégico.png" alt="Ícone de Marketing Estratégico" loading="lazy">
                        </div>
                        <h3>Marketing Estratégico</h3>
                        <p>Campanhas que geram resultado</p>
                    </a>
                </article>

            </div>
        </section>

    </main>

</body>
</html>
