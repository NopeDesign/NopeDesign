<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Nope Design está à disposição para esclarecer dúvidas e fornecer informações adicionais.">
    <title>Banner | Nope Design</title>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/meio3.css">
</head>
<body>

    <!-- Seção do Banner Principal -->
    <section class="banner" aria-label="Contato Nope Design">
        <div class="container">
            
            <!-- Conteúdo de Texto e Logo -->
            <div class="content">
                <div class="logo">
                    <img src="/page-3/src/logo.png" alt="Logotipo oficial da Nope Design">
                </div>
                <p class="description">
                    Estamos à disposição para esclarecer quaisquer dúvidas ou fornecer informações adicionais.
                </p>
            </div>

            <!-- Apresentação Visual (Mockup) -->
            <div class="mockup">
                <img src="/page-3/src/celular-baixo.png" alt="Mockup de celular exibindo conteúdo no Instagram">
            </div>
            
        </div>
    </section>

</body>
</html>
