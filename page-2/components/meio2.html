<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conheça a fundadora da NOPE Design.">
  <title>Nossa Fundadora | NOPE Design</title>

  <!-- Folha de estilos ajustada com ./ para o GitHub Pages -->
  <link rel="stylesheet" href="./css/meio2.css">
</head>
<body>

  <section class="founder-section" aria-labelledby="founder-title">
    <h2 id="founder-title" class="title">NOSSA FUNDADORA</h2>
    
    <div class="founder-container">
      
      <!-- Cartão da Fundadora -->
      <article class="founder-card">
        <figure class="image-wrapper">
          <!-- Caminho da imagem ajustado com ./ -->
          <img 
            src="./src/fundadora-1.png" 
            alt="Retrato de Luara, fundadora da NOPE Design" 
            loading="lazy"
          >
        </figure>
        <div class="founder-details">
          <h3>Luara</h3>
          <p class="role">Fundadora</p>
        </div>
      </article>

      <!-- Informações sobre a criação da empresa -->
      <div class="founder-info">
        <h3 class="purple-text">A Essência da NOPE</h3>
        <p>
          Fundada em 2024, a NOPE Design nasceu para unir estratégia, tecnologia e design, 
          criando marcas com propósito, posicionamento forte e resultados reais.
        </p>
      </div>

    </div>
  </section>

</body>
</html>
